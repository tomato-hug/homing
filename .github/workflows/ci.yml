name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go vet and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  protocol:
    name: Protocol vectors (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/protocol-js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/protocol-js/package-lock.json
      - run: npm ci
      - run: npm test

  server:
    name: Cloud relay (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install shared protocol package
        working-directory: packages/protocol-js
        run: npm ci
      - run: npm ci
      - run: npm test

  android:
    name: Android tests and debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: homing-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
