name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (vX.Y.Z)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            gui: true
          - name: macOS amd64
            os: macos-latest
            goos: darwin
            goarch: amd64
            gui: true
          - name: Windows amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            gui: true
          - name: Windows arm64
            os: windows-latest
            goos: windows
            goarch: arm64
            gui: true
          - name: Linux amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            gui: false
          - name: Linux arm64
            os: ubuntu-latest
            goos: linux
            goarch: arm64
            gui: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Build embedded console
        shell: bash
        run: bash scripts/build-console.sh
      - name: Build binaries
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GUI: ${{ matrix.gui }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          tags=()
          [ "$GUI" != "true" ] && tags=(-tags headless)
          if [ "$GOOS" = "windows" ]; then
            python scripts/package-windows.py \
              --version "${VERSION#v}" \
              --arch "$GOARCH" \
              --skip-console-build \
              --commit "$GITHUB_SHA" \
              --output dist/win-pkg
            cp dist/win-pkg/*.zip dist/
            cp dist/win-pkg/homing_windows_${GOARCH}.exe dist/
            rm -rf dist/win-pkg
          elif [ "$GOOS" = "darwin" ]; then
            clang_arch="arm64"
            [ "$GOARCH" = "amd64" ] && clang_arch="x86_64"
            CGO_ENABLED=1 CGO_CFLAGS="-arch ${clang_arch} -mmacosx-version-min=13.0" \
              CGO_LDFLAGS="-arch ${clang_arch} -mmacosx-version-min=13.0" \
              go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION#v} -extldflags '-arch ${clang_arch} -mmacosx-version-min=13.0'" \
              -o "dist/homing_${GOOS}_${GOARCH}${ext}" ./cmd/homing
            python3 scripts/package-macos.py \
              --version "${VERSION#v}" \
              --arch "$GOARCH" \
              --skip-console-build \
              --commit "$GITHUB_SHA" \
              --output dist/macos-pkg
            cp dist/macos-pkg/*.zip dist/
            rm -rf dist/macos-pkg
          else
            CGO_ENABLED=0 go build "${tags[@]}" -trimpath \
              -ldflags "-s -w -X main.version=${VERSION#v}" \
              -o "dist/homing_${GOOS}_${GOARCH}${ext}" ./cmd/homing
          fi
          CGO_ENABLED=0 go build -tags headless -trimpath \
            -ldflags "-s -w -X main.version=${VERSION#v}" \
            -o "dist/homing-server_${GOOS}_${GOARCH}${ext}" ./cmd/homing-server
      - uses: actions/upload-artifact@v4
        with:
          name: homing-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/homing*
            dist/Homing*
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Build Android APK
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/homing-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: homing-android
          path: dist/homing-android.apk
          if-no-files-found: error

  release:
    needs: [binaries, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum homing* Homing* 2>/dev/null > checksums.txt
          cat checksums.txt
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --generate-notes --title "Homing $TAG" --latest
          fi

  docker:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/tomato-hug/homing
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
