# Hermes Agent — 官方示例清单（SQLite，支持 WAL 模式与消息正文读取）
id: hermes
name: Hermes Agent
icon: hermes

detect:
  bin: [hermes]
  paths:
    - ~/.hermes

sessions:
  source: sqlite
  db: ~/.hermes/state.db
  query: >
    select id as session_id, title, model, started_at as last_ts, message_count
    from sessions order by started_at desc
  items_query: >
    select id, role, content as text, timestamp as ts
    from messages where session_id = ? order by id desc limit ?

push: poll
