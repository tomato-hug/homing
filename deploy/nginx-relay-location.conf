# Place these locations inside the dedicated Homing HTTPS server block.
# TLS certificates and the server_name belong to that block; do not replace
# another application's virtual host or open port 18789 in the cloud firewall.
location = /v1/ws {
    proxy_pass http://127.0.0.1:18789;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # Replace any client-supplied value at this public-facing edge.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
}

location = /health {
    proxy_pass http://127.0.0.1:18789;
    proxy_set_header Host $host;
    access_log off;
}

location / {
    return 404;
}
