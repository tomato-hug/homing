# 将以下 location 块放入专用的 Homing HTTPS server 块中（server_name 与 TLS 证书属于该块）。
# 不要替换其他站点的虚拟主机，也不要在云防火墙开放后端端口 18789：后端只监听 127.0.0.1。
# 托管模式（HOMING_AUTH_MODE=managed）需要放行 /account、/admin、/v1/account/、/v1/admin/。

# 1. 端到端加密中继 WebSocket
location = /v1/ws {
    proxy_pass http://127.0.0.1:18789;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # 在面向公网的这一层覆盖客户端自带的值，防止伪造来源 IP。
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
}

# 2. 健康检查
location = /health {
    proxy_pass http://127.0.0.1:18789;
    proxy_set_header Host $host;
    access_log off;
}

# 3. 用户账号中心页面与账号 API
location ~ ^/(account|admin)/?$ {
    proxy_pass http://127.0.0.1:18789;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 4. 账号 API 与管理 API
location ~ ^/v1/(account|admin)/ {
    proxy_pass http://127.0.0.1:18789;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
}

# 5. 其余路径一律 404
location / {
    return 404;
}
