# Hermes Agent — 官方示例清单（SQLite）
# state.db 的 sessions 表没有 title / cwd 列，标题会回落到 session_id；
# messages 表当前 0 行，所以实测会话数为 0。
id: hermes
name: Hermes Agent
icon: hermes

detect:
  bin: [hermes]
  paths:
    - ~/.hermes

sessions:
  source: sqlite
  db: ~/.hermes/state.db
  query: >
    select id as session_id, model, started_at as last_ts, message_count
    from sessions order by started_at desc

push: poll
